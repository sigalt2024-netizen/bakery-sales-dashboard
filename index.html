<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="Mobile-friendly sales dashboard for The Bakery Shop.">
  <title>The Bakery Shop — Sales Dashboard</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Icon sprite (24x24, filled, rounded style) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></symbol>
  <symbol id="i-loaf" viewBox="0 0 24 24"><path d="M4 14a5 5 0 0 1 3-9h10a5 5 0 0 1 3 9v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-5z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><path d="M6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm12 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></symbol>
  <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M18 17H6v-2h12v2zm0-4H6v-2h12v2zm0-4H6V7h12v2zM3 22l1.5-1.5L6 22l1.5-1.5L9 22l1.5-1.5L12 22l1.5-1.5L15 22l1.5-1.5L18 22l1.5-1.5L21 22V2l-1.5 1.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2 4.5 3.5 3 2v20z"/></symbol>
  <symbol id="i-basket" viewBox="0 0 24 24"><path d="M17.21 9l-4.38-6.56a1 1 0 0 0-1.66 0L6.79 9H2v2h1.17l1.84 9.2A2 2 0 0 0 7 22h10a2 2 0 0 0 1.99-1.8L20.83 11H22V9h-4.79zM12 4.8L14.8 9H9.2L12 4.8zM12 18a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M21 18v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1h-9a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h9zm-9-2h10V8H12v8zm4-2.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm.5 5v5.25l4.5 2.67-.75 1.23L11 13V7h1.5z"/></symbol>
  <symbol id="i-coin" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15.5V19h-2v-1.5c-1.5-.3-2.6-1.2-2.8-2.7h1.9c.2.7.8 1.1 1.9 1.1s1.7-.4 1.7-1c0-.7-.5-.9-2-1.3-1.9-.5-3.2-1.1-3.2-2.8 0-1.3 1-2.2 2.5-2.5V5h2v1.5c1.4.3 2.3 1.2 2.5 2.6h-1.9c-.2-.7-.7-1-1.6-1s-1.6.4-1.6 1c0 .6.5.8 1.9 1.2 1.9.5 3.3 1.1 3.3 2.9 0 1.4-1.1 2.3-2.6 2.6z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M4 15l8-8 8 8H4z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M4 9l8 8 8-8H4z"/></symbol>
  <symbol id="i-card" viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></symbol>
  <symbol id="i-cash" viewBox="0 0 24 24"><path d="M19 14V6c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zm-9-1c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-6v11c0 1.1-.9 2-2 2H4v-2h17V7h2z"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M17 1H7a2 2 0 0 0-2 2v18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm0 18H7V5h10v14z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a3.3 3.3 0 0 0 0-1.4l7.05-4.11A2.99 2.99 0 1 0 15 5c0 .24.04.47.09.7L8.04 9.81a3 3 0 1 0 0 4.38l7.12 4.16c-.05.21-.08.43-.08.65a2.92 2.92 0 1 0 2.92-2.92z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-5.4-5.4c0-1.81.89-3.42 2.26-4.4A9.2 9.2 0 0 0 12 3z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></symbol>
</svg>

<header class="app-header">
  <a class="logo-link" href="#home" data-nav="home" aria-label="The Bakery Shop — go to Home">
    <img class="logo" src="assets/logo.jpg" alt="The Bakery Shop — Fresh &amp; Delicious, est. 2022">
  </a>
  <div class="header-text">
    <h1>Sales Dashboard</h1>
    <p id="dateLabel" class="sub"></p>
    <p id="updated" class="sub"></p>
  </div>
  <button id="refreshBtn" class="icon-btn" data-action="refresh" aria-label="Refresh data">
    <svg class="icon i32" aria-hidden="true"><use href="#i-refresh"/></svg>
  </button>
</header>

<div class="page">

  <!-- Period selector + active category filter (hidden on More) -->
  <div id="controls" class="controls">
    <div class="seg" role="group" aria-label="Time period">
      <button data-period="today" aria-pressed="true">Today</button>
      <button data-period="week" aria-pressed="false">Week</button>
      <button data-period="month" aria-pressed="false">Month</button>
    </div>
    <div id="filterBar"></div>
  </div>

  <!-- HOME -->
  <main>
  <section id="view-home" class="view home-grid" aria-label="Home">
    <article id="hero" class="hero span2" aria-live="polite"></article>
    <div id="kpis" class="kpis span2"></div>

    <section class="card span2" aria-labelledby="homeChartTitle">
      <h2 id="homeChartTitle">Sales by hour</h2>
      <div id="homeChart"></div>
    </section>

    <section class="card" aria-labelledby="bestTitle">
      <h2 id="bestTitle">Best sellers</h2>
      <div id="best"></div>
      <button class="btn secondary" data-nav="items">See all items <svg class="icon i28" aria-hidden="true"><use href="#i-chevron"/></svg></button>
    </section>

    <section class="card" aria-labelledby="catTitle">
      <h2 id="catTitle">Sales by category</h2>
      <div id="donut"></div>
    </section>
  </section>

  <!-- SALES -->
  <section id="view-sales" class="view stack" aria-label="Sales" hidden>
    <div class="seg" role="group" aria-label="Metric">
      <button data-metric="revenue" aria-pressed="true">Revenue</button>
      <button data-metric="orders" aria-pressed="false">Orders</button>
      <button data-metric="items" aria-pressed="false">Items</button>
    </div>
    <section class="card" aria-labelledby="salesChartTitle">
      <h2 id="salesChartTitle">Sales trend</h2>
      <div id="salesChart"></div>
    </section>
    <section class="card" aria-labelledby="payTitle">
      <h2 id="payTitle">How customers paid</h2>
      <div id="pay"></div>
    </section>
    <section aria-labelledby="daysTitle">
      <h2 id="daysTitle" class="plain-h">Daily totals</h2>
      <div id="days" class="stack"></div>
    </section>
  </section>

  <!-- ITEMS -->
  <section id="view-items" class="view stack" aria-label="Items" hidden>
    <label class="search">
      <svg class="icon i32" aria-hidden="true"><use href="#i-search"/></svg>
      <span class="sr">Search items</span>
      <input id="search" type="search" placeholder="Search items…" autocomplete="off">
    </label>
    <div id="chips" class="chips" role="group" aria-label="Category"></div>
    <div id="itemList" class="stack"></div>
  </section>

  <!-- MORE -->
  <section id="view-more" class="view stack" aria-label="More" hidden>
    <h2 class="plain-h">More</h2>
    <button class="btn primary" data-action="export">
      <svg class="icon i28" aria-hidden="true"><use href="#i-download"/></svg> Export CSV
    </button>
    <button class="btn secondary" data-action="share">
      <svg class="icon i28" aria-hidden="true"><use href="#i-share"/></svg> Share today's summary
    </button>
    <button class="btn secondary" data-action="theme" aria-pressed="false">
      <svg class="icon i28" aria-hidden="true"><use href="#i-moon"/></svg> <span id="themeLabel">Dark mode: off</span>
    </button>
    <section class="card about">
      <img src="assets/logo.jpg" alt="The Bakery Shop logo" class="about-logo">
      <p><strong>The Bakery Shop</strong><br>Fresh &amp; Delicious · Est. 2022</p>
      <p class="muted">This is the first version of the dashboard. All numbers are <strong>sample data</strong> generated in your browser, not real sales.</p>
    </section>
  </section>
  </main>
</div>

<nav class="bottom-nav" aria-label="Main">
  <button data-nav="home" aria-current="page"><svg class="icon i32" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></button>
  <button data-nav="sales"><svg class="icon i32" aria-hidden="true"><use href="#i-chart"/></svg><span>Sales</span></button>
  <button data-nav="items"><svg class="icon i32" aria-hidden="true"><use href="#i-loaf"/></svg><span>Items</span></button>
  <button data-nav="more"><svg class="icon i32" aria-hidden="true"><use href="#i-more"/></svg><span>More</span></button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
